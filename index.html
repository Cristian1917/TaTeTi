<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tres en Raya</title>
<style>
  :root {
    --x: #38e1ff;
    --o: #ff4d8d;
    --bg: #111111;
    --card: #161a30;
    --line: #2a3050;
    --text: #e8ecff;
    --muted: #8b93bd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--text);
    background: #111111;
  }

  .game {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px 22px 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
  }

  h1 {
    font-size: 1.6rem;
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 18px;
  }

  .menu {
    position: absolute;
    top: 16px;
    right: 16px;
  }

  .menu-btn {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    color: var(--text);
    background: #0f1226;
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
  }

  .menu-btn:hover { background: #1c2140; border-color: #4a5480; }

  .menu-dropdown {
    position: absolute;
    top: 46px;
    right: 0;
    min-width: 210px;
    padding: 6px;
    background: #1a1f3a;
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
    display: none;
    z-index: 10;
  }

  .menu-dropdown.open { display: block; }

  .menu-title {
    padding: 6px 12px 4px;
    font-size: .7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  .menu-dropdown button {
    display: block;
    width: 100%;
    padding: 10px 12px;
    text-align: left;
    font-family: inherit;
    font-size: .95rem;
    color: var(--text);
    background: transparent;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }

  .menu-dropdown button:hover { background: #242b52; }
  .menu-dropdown button.active { color: var(--x); font-weight: 600; }

  .scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
    text-align: center;
  }

  .score {
    background: #0f1226;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 4px;
  }

  .score b {
    display: block;
    font-size: 1.25rem;
    line-height: 1.2;
  }

  .score span {
    font-size: .72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  .score.x b { color: var(--x); }
  .score.o b { color: var(--o); }

  .status {
    text-align: center;
    min-height: 22px;
    margin-bottom: 14px;
    font-size: .98rem;
    color: var(--muted);
  }

  .status.win-x { color: var(--x); }
  .status.win-o { color: var(--o); }

  .board {
    display: grid;
    grid-template-columns: repeat(var(--size, 3), 1fr);
    grid-template-rows: repeat(var(--size, 3), 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
  }

  .board[data-size="5"] { gap: 6px; }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #0f1226;
    border: 2px solid var(--line);
    border-radius: 14px;
    font-size: clamp(2.4rem, 12vw, 3.6rem);
    font-weight: 700;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    transition: transform .12s ease, border-color .2s ease, background .2s ease;
    animation: pop .18s ease;
  }

  .board[data-size="5"] .cell {
    border-radius: 8px;
    font-size: clamp(.9rem, 5vw, 1.5rem);
  }

  .cell:hover:not(:disabled) {
    border-color: #4a5480;
    background: #141833;
  }

  .cell:disabled { cursor: default; }

  .cell.x { color: var(--x); text-shadow: 0 0 18px rgba(56, 225, 255, .5); }
  .cell.o { color: var(--o); text-shadow: 0 0 18px rgba(255, 77, 141, .5); }

  .cell.win {
    border-color: #ffd166;
    background: rgba(255, 209, 102, .12);
    animation: glow .7s ease-in-out infinite alternate;
  }

  .controls {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  button.reset {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    color: #0d1020;
    background: linear-gradient(90deg, var(--x), #6ee7ff);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    transition: filter .2s ease, transform .1s ease;
  }

  button.reset:hover { filter: brightness(1.1); }
  button.reset:active { transform: scale(.98); }

  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .9rem;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  .toggle input { accent-color: var(--x); width: 16px; height: 16px; cursor: pointer; }

  @keyframes pop { from { transform: scale(.85); } to { transform: scale(1); } }

  @keyframes glow {
    from { box-shadow: 0 0 0 rgba(255, 209, 102, 0); }
    to { box-shadow: 0 0 22px rgba(255, 209, 102, .55); }
  }
</style>
</head>
<body>
<main class="game">
  <div class="menu">
    <button class="menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Opciones">&#9776;</button>
    <div class="menu-dropdown" id="menuDropdown">
      <div class="menu-title">Tamaño del tablero</div>
      <button class="size-opt" data-size="3">Clásico 3×3 · 3 en línea</button>
      <button class="size-opt" data-size="5">Grande 5×5 · 5 en línea</button>
    </div>
  </div>

  <h1 id="title">Tres en Raya</h1>

  <div class="scores">
    <div class="score x"><b id="scoreX">0</b><span>Jugador X</span></div>
    <div class="score"><b id="scoreD">0</b><span>Empates</span></div>
    <div class="score o"><b id="scoreO">0</b><span>Jugador O</span></div>
  </div>

  <div class="status" id="status" aria-live="polite">Turno de X</div>

  <div class="board" id="board" role="grid" aria-label="Tablero de juego"></div>

  <div class="controls">
    <button class="reset" id="reset">Nueva partida</button>
    <label class="toggle">
      <input type="checkbox" id="aiMode"> Jugar contra la máquina
    </label>
  </div>
</main>

<script>
  const MODES = {
    3: { run: 3, title: 'Tres en Raya' },
    5: { run: 5, title: 'Cinco en Raya' }
  };

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetEl = document.getElementById('reset');
  const aiModeEl = document.getElementById('aiMode');
  const titleEl = document.getElementById('title');
  const menuBtn = document.getElementById('menuBtn');
  const menuDropdown = document.getElementById('menuDropdown');
  const scoreEls = {
    X: document.getElementById('scoreX'),
    O: document.getElementById('scoreO'),
    D: document.getElementById('scoreD')
  };

  let size = 3;
  let run = 3;
  let LINES = generateLines(size, run);
  let cells = [];
  let state = [];
  let turn = 'X';
  let finished = false;
  let aiMode = false;
  let thinking = false;
  const score = { X: 0, O: 0, D: 0 };

  function generateLines(n, length) {
    const lines = [];
    for (let r = 0; r < n; r++) {
      for (let c = 0; c + length <= n; c++) {
        const line = [];
        for (let k = 0; k < length; k++) line.push(r * n + c + k);
        lines.push(line);
      }
    }
    for (let c = 0; c < n; c++) {
      for (let r = 0; r + length <= n; r++) {
        const line = [];
        for (let k = 0; k < length; k++) line.push((r + k) * n + c);
        lines.push(line);
      }
    }
    for (let r = 0; r + length <= n; r++) {
      for (let c = 0; c + length <= n; c++) {
        const line = [];
        for (let k = 0; k < length; k++) line.push((r + k) * n + c + k);
        lines.push(line);
      }
    }
    for (let r = 0; r + length <= n; r++) {
      for (let c = length - 1; c < n; c++) {
        const line = [];
        for (let k = 0; k < length; k++) line.push((r + k) * n + c - k);
        lines.push(line);
      }
    }
    return lines;
  }

  function buildBoard() {
    cells = [];
    state = Array(size * size).fill('');
    boardEl.innerHTML = '';
    boardEl.dataset.size = size;
    boardEl.style.setProperty('--size', size);
    for (let i = 0; i < size * size; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.type = 'button';
      cell.dataset.index = i;
      cell.setAttribute('aria-label', 'Casilla ' + (i + 1));
      cell.addEventListener('click', () => play(i));
      cells.push(cell);
      boardEl.appendChild(cell);
    }
  }

  function render() {
    for (let i = 0; i < state.length; i++) {
      cells[i].textContent = state[i];
      cells[i].className = 'cell' + (state[i] ? ' ' + state[i].toLowerCase() : '');
    }
    scoreEls.X.textContent = score.X;
    scoreEls.O.textContent = score.O;
    scoreEls.D.textContent = score.D;
  }

  function findWinningLine(board) {
    for (const line of LINES) {
      const first = board[line[0]];
      if (first && line.every(i => board[i] === first)) return line;
    }
    return null;
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function play(index) {
    if (finished || thinking || state[index]) return;
    if (aiMode && turn === 'O') return;

    state[index] = turn;
    render();

    if (finishTurn()) return;

    turn = turn === 'X' ? 'O' : 'X';
    setStatus('Turno de ' + turn);

    if (aiMode && turn === 'O') aiMove();
  }

  function finishTurn() {
    const line = findWinningLine(state);

    if (line) {
      const winner = state[line[0]];
      finished = true;
      score[winner]++;
      render();
      line.forEach(i => cells[i].classList.add('win'));
      setStatus(winner === 'X' ? '¡Gana X!' : '¡Gana O!', 'win-' + winner.toLowerCase());
      disableAll();
      return true;
    }

    if (state.every(v => v)) {
      finished = true;
      score.D++;
      render();
      setStatus('¡Empate!');
      disableAll();
      return true;
    }

    return false;
  }

  function disableAll() {
    cells.forEach(c => { c.disabled = true; });
  }

  function reset() {
    buildBoard();
    turn = 'X';
    finished = false;
    thinking = false;
    render();
    setStatus('Turno de X');
    if (aiMode && turn === 'O') aiMove();
  }

  function minimax(board, depth, isMax) {
    const line = findWinningLine(board);
    if (line) {
      const w = board[line[0]];
      return w === 'O' ? 10 - depth : depth - 10;
    }
    if (board.every(v => v)) return 0;

    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < board.length; i++) {
        if (board[i]) continue;
        board[i] = 'O';
        best = Math.max(best, minimax(board, depth + 1, false));
        board[i] = '';
      }
      return best;
    }

    let best = Infinity;
    for (let i = 0; i < board.length; i++) {
      if (board[i]) continue;
      board[i] = 'X';
      best = Math.min(best, minimax(board, depth + 1, true));
      board[i] = '';
    }
    return best;
  }

  function bestMoveSmall() {
    const simulation = state.slice();
    let bestScore = -Infinity;
    let candidates = [];

    for (let i = 0; i < state.length; i++) {
      if (state[i]) continue;
      simulation[i] = 'O';
      const value = minimax(simulation, 1, false);
      simulation[i] = '';
      if (value > bestScore) {
        bestScore = value;
        candidates = [i];
      } else if (value === bestScore) {
        candidates.push(i);
      }
    }

    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function wouldComplete(index, player) {
    for (const line of LINES) {
      if (!line.includes(index)) continue;
      if (line.every(j => j === index || state[j] === player)) return true;
    }
    return false;
  }

  function bestMoveBig() {
    const empties = [];
    for (let i = 0; i < state.length; i++) if (!state[i]) empties.push(i);
    if (!empties.length) return undefined;

    for (const i of empties) if (wouldComplete(i, 'O')) return i;
    for (const i of empties) if (wouldComplete(i, 'X')) return i;

    const center = (size - 1) / 2;
    let best = -Infinity;
    let candidates = [];

    for (const i of empties) {
      const r = Math.floor(i / size);
      const c = i % size;
      let value = -(Math.abs(r - center) + Math.abs(c - center)) * 0.5;

      for (const line of LINES) {
        if (!line.includes(i)) continue;
        let o = 0, x = 0;
        for (const j of line) {
          if (state[j] === 'O') o++;
          else if (state[j] === 'X') x++;
        }
        if (o && x) continue;
        if (x === 0) value += Math.pow(10, o);
        if (o === 0) value -= Math.pow(10, x) * 0.9;
      }

      if (value > best) { best = value; candidates = [i]; }
      else if (value === best) candidates.push(i);
    }

    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function aiMove() {
    thinking = true;
    setStatus('Pensando...');
    setTimeout(() => {
      thinking = false;
      const move = size <= 3 ? bestMoveSmall() : bestMoveBig();
      if (move === undefined) return;
      state[move] = 'O';
      render();
      if (finishTurn()) return;
      turn = 'X';
      setStatus('Turno de X');
    }, size <= 3 ? 350 : 220);
  }

  function setBoardSize(n) {
    const mode = MODES[n];
    if (!mode) return;
    size = n;
    run = mode.run;
    LINES = generateLines(size, run);
    titleEl.textContent = mode.title;
    document.title = mode.title;
    score.X = score.O = score.D = 0;
    reset();
    document.querySelectorAll('.size-opt').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.size) === size);
    });
  }

  function openMenu() {
    menuDropdown.classList.add('open');
    menuBtn.setAttribute('aria-expanded', 'true');
  }

  function closeMenu() {
    menuDropdown.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }

  resetEl.addEventListener('click', reset);

  aiModeEl.addEventListener('change', () => {
    aiMode = aiModeEl.checked;
    score.X = score.O = score.D = 0;
    reset();
  });

  menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (menuDropdown.classList.contains('open')) closeMenu();
    else openMenu();
  });

  menuDropdown.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', closeMenu);

  document.querySelectorAll('.size-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      setBoardSize(Number(btn.dataset.size));
      closeMenu();
    });
  });

  document.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r') reset();
    if (size <= 3 && /^[1-9]$/.test(e.key)) play(Number(e.key) - 1);
  });

  setBoardSize(3);
</script>
</body>
</html>
